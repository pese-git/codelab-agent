[project]
name = "codelab"
version = "0.2.0"
description = "Unified ACP implementation - agent server and client in one package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
  "websockets>=12.0",
  "aiofiles>=24.1.0",
  "aiohttp>=3.13.5",
  "structlog>=24.1.0",
  "rich>=13.0.0",
  "python-dotenv>=1.2.2",
  "openai>=2.32.0",
  "anthropic>=0.97.0",
  "litellm>=1.50.0",
  "textual>=8.2.4",
  "textual-serve>=1.1.0",
  "dishka>=1.10.1",
  "tree-sitter>=0.21.0",
  "tree-sitter-python>=0.21.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-dart>=0.1.0",
  "tree-sitter-go>=0.21.0",
  "tree-sitter-rust>=0.21.0",
  "tree-sitter-java>=0.21.0",
  "tree-sitter-cpp>=0.23.0",
  "tiktoken>=0.13.0",
]

[project.scripts]
codelab = "codelab.cli:main"

[project.optional-dependencies]
server = [
  "openai>=2.32.0",
  "anthropic>=0.97.0",
  "mcp>=1.9.4",
]
tui = [
  "textual>=8.2.4",
]
web = [
  "textual-serve>=1.1.0",
]
full = [
  "codelab[server,tui,web]",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.11",
    "ty>=0.0.32",
    "commitizen>=4.0.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codelab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
# P0-2 ЗАКРЫТ (2026-07-15): целевой порог сложности. Все блоки >10 декомпозированы;
# guardrail ловит любой регресс цикломатической сложности выше 10 (ruff-mccabe).
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Тесты не подпадают под ограничение сложности (фикстуры/параметризация).
"tests/**/*.py" = ["SIM117", "C901"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# Игнорируем ошибки связанные с внешними библиотеками и динамическим кодом
"no-matching-overload" = "ignore"
"unknown-argument" = "ignore"
"missing-argument" = "ignore"
"unresolved-attribute" = "ignore"
"unresolved-import" = "ignore"

[tool.pytest.ini_options]
pythonpath = ["src", "tests/server"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # P0-3a (2026-07): все холостые корутины устранены в корне (мок-гигиена: spec для
    # AsyncMock-транспортов/клиентов, закрытие корутин в мокнутых asyncio-примитивах,
    # subprocess-teardown). Оба класса warnings переведены в `error` как guardrail
    # против регресса — полный проявляющий прогон даёт 0 unraisable.
    "error:coroutine.*was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # Исключения — внутренние reactive-корутины самого textual (вне нашего контроля):
    # оставлены `ignore` и как RuntimeWarning, и как unraisable (порядок: узкие ignore
    # ПОСЛЕ error — у pytest побеждает последний совпавший фильтр).
    "ignore:coroutine.*DirectoryTree\\.watch_path:RuntimeWarning",
    "ignore:coroutine.*SearchInput:RuntimeWarning",
    # NB: literal ':' нельзя в message-поле фильтра (pytest делит строку по ':'),
    # поэтому '.*' вместо 'in: <coroutine object'.
    "ignore:Exception ignored in.*DirectoryTree\\.watch_path:pytest.PytestUnraisableExceptionWarning",
    "ignore:Exception ignored in.*SearchInput:pytest.PytestUnraisableExceptionWarning",
]

[tool.importlinter]
# Гейт направления зависимостей между слоями. Контракты включены в режиме ratchet:
# все текущие протечки перечислены в ignore_imports, чтобы зафиксировать «не хуже».
# Правило: строку из ignore_imports УДАЛЯТЬ по мере исправления протечки. Новые
# нарушения, не входящие в список, ломают сборку. Пустой ignore_imports = слой чист.
root_packages = ["codelab"]

[[tool.importlinter.contracts]]
name = "Client Clean Architecture layers"
type = "layers"
layers = [
    "codelab.client.tui",
    "codelab.client.presentation",
    "codelab.client.infrastructure",
    "codelab.client.application",
    "codelab.client.domain",
]
# ДОЛГ: infrastructure тянет presentation. Основной источник — DI-композиция
# (view_model_provider/providers как composition root) и ACP-хендлеры, дергающие
# presentation-executors напрямую. Инвертировать через абстракции/протоколы.
ignore_imports = [
    "codelab.client.infrastructure.providers -> codelab.client.presentation.chat.executors.fs_callback_executor",
    "codelab.client.infrastructure.providers -> codelab.client.presentation.chat.executors.terminal_callback_executor",
    "codelab.client.infrastructure.providers -> codelab.client.presentation.chat.executors.terminal_executor_adapter",
    "codelab.client.infrastructure.services.acp_transport.handlers.fs_read_handler -> codelab.client.presentation.chat.executors.fs_callback_executor",
    "codelab.client.infrastructure.services.acp_transport.handlers.fs_write_handler -> codelab.client.presentation.chat.executors.fs_callback_executor",
    "codelab.client.infrastructure.services.acp_transport.handlers.terminal_create_handler -> codelab.client.presentation.chat.executors.terminal_callback_executor",
    "codelab.client.infrastructure.services.acp_transport.handlers.terminal_kill_handler -> codelab.client.presentation.chat.executors.terminal_callback_executor",
    "codelab.client.infrastructure.services.acp_transport.handlers.terminal_output_handler -> codelab.client.presentation.chat.executors.terminal_callback_executor",
    "codelab.client.infrastructure.services.acp_transport.handlers.terminal_release_handler -> codelab.client.presentation.chat.executors.terminal_callback_executor",
    "codelab.client.infrastructure.services.acp_transport.handlers.terminal_wait_handler -> codelab.client.presentation.chat.executors.terminal_callback_executor",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.dispatcher.session_update_dispatcher",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.executors.fs_callback_executor",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.executors.terminal_callback_executor",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.executors.terminal_executor_adapter",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.handlers.config_option_handler",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.handlers.message_chunk_handler",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.handlers.plan_update_handler",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.handlers.tool_call_handler",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat.persistence.file_chat_persistence",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.chat_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.config_option_selector_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.file_viewer_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.filesystem_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.model_selector_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.permission_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.plan_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.session_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.terminal_log_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.terminal_view_model",
    "codelab.client.infrastructure.view_model_provider -> codelab.client.presentation.ui_view_model",
]

[[tool.importlinter.contracts]]
name = "Server layers"
type = "layers"
layers = [
    "codelab.server.transport",
    "codelab.server.protocol",
    "codelab.server.agent",
    "codelab.server.domain",
]
# ДОЛГ (ADR-003): agent типизируется против protocol.state.SessionState —
# симптом незавершённой доменной миграции (сериализационная модель протекает в
# ядро вместо доменного агрегата domain.Session). Целевое решение — вариант B из
# ADR-003 (agent оперирует domain.Session, маппинг на границе через SessionMapper),
# выполняется отдельным эпиком. До него строки ниже — единственный трекер долга;
# удалять по мере выполнения B, обходные абстракции не вводить.
# См. doc/internals/architecture/adr/ADR-003-sessionstate-domain-migration.md
ignore_imports = [
    "codelab.server.agent.base -> codelab.server.protocol.state",
    "codelab.server.agent.execution_engine -> codelab.server.protocol.state",
    "codelab.server.agent.strategies.base -> codelab.server.protocol.state",
    "codelab.server.agent.strategies.dispatcher -> codelab.server.protocol.state",
    "codelab.server.agent.system_prompt_builder -> codelab.server.protocol.state",
    "codelab.server.agent.tool_filter -> codelab.server.protocol.state",
    "codelab.server.agent.context.file_cache_decorator -> codelab.server.protocol.state",
    "codelab.server.agent.context.child_session -> codelab.server.protocol.session_factory",
    "codelab.server.storage.base -> codelab.server.protocol.state",
    "codelab.server.tools.executors.decorators.base -> codelab.server.protocol.state",
]

[[tool.importlinter.contracts]]
name = "Server domain must not depend on client"
type = "forbidden"
source_modules = ["codelab.server.domain"]
forbidden_modules = ["codelab.client"]

[[tool.importlinter.contracts]]
name = "shared must stay a leaf"
type = "forbidden"
source_modules = ["codelab.shared"]
forbidden_modules = ["codelab.client", "codelab.server"]
# ДОЛГ: shared/web_ui лениво тянет server.web_app — вынести в вызывающий слой.
ignore_imports = [
    "codelab.shared.web_ui -> codelab.server.web_app",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
