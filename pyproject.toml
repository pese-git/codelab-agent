[project]
name = "codelab"
version = "0.1.0"
description = "Unified ACP implementation - agent server and client in one package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
  "websockets>=12.0",
  "aiofiles>=24.1.0",
  "aiohttp>=3.13.5",
  "structlog>=24.1.0",
  "rich>=13.0.0",
  "python-dotenv>=1.2.2",
  "openai>=2.32.0",
  "anthropic>=0.97.0",
  "textual>=8.2.4",
  "textual-serve>=1.1.0",
  "dishka>=1.10.1",
  "tree-sitter>=0.21.0",
  "tree-sitter-python>=0.21.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-dart>=0.1.0",
  "tree-sitter-go>=0.21.0",
  "tree-sitter-rust>=0.21.0",
  "tree-sitter-java>=0.21.0",
  "tree-sitter-cpp>=0.23.0",
  "tiktoken>=0.13.0",
]

[project.scripts]
codelab = "codelab.cli:main"

[project.optional-dependencies]
server = [
  "openai>=2.32.0",
  "anthropic>=0.97.0",
  "mcp>=1.9.4",
]
tui = [
  "textual>=8.2.4",
]
web = [
  "textual-serve>=1.1.0",
]
full = [
  "codelab[server,tui,web]",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.11",
    "ty>=0.0.32",
    "commitizen>=4.0.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codelab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
# P0-2 ЗАКРЫТ (2026-07-15): целевой порог сложности. Все блоки >10 декомпозированы;
# guardrail ловит любой регресс цикломатической сложности выше 10 (ruff-mccabe).
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Тесты не подпадают под ограничение сложности (фикстуры/параметризация).
"tests/**/*.py" = ["SIM117", "C901"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# Игнорируем ошибки связанные с внешними библиотеками и динамическим кодом
"no-matching-overload" = "ignore"
"unknown-argument" = "ignore"
"missing-argument" = "ignore"
"unresolved-attribute" = "ignore"
"unresolved-import" = "ignore"

[tool.pytest.ini_options]
pythonpath = ["src", "tests/server"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # P0-3a (2026-07): все холостые корутины устранены в корне (мок-гигиена: spec для
    # AsyncMock-транспортов/клиентов, закрытие корутин в мокнутых asyncio-примитивах,
    # subprocess-teardown). Оба класса warnings переведены в `error` как guardrail
    # против регресса — полный проявляющий прогон даёт 0 unraisable.
    "error:coroutine.*was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # Исключения — внутренние reactive-корутины самого textual (вне нашего контроля):
    # оставлены `ignore` и как RuntimeWarning, и как unraisable (порядок: узкие ignore
    # ПОСЛЕ error — у pytest побеждает последний совпавший фильтр).
    "ignore:coroutine.*DirectoryTree\\.watch_path:RuntimeWarning",
    "ignore:coroutine.*SearchInput:RuntimeWarning",
    # NB: literal ':' нельзя в message-поле фильтра (pytest делит строку по ':'),
    # поэтому '.*' вместо 'in: <coroutine object'.
    "ignore:Exception ignored in.*DirectoryTree\\.watch_path:pytest.PytestUnraisableExceptionWarning",
    "ignore:Exception ignored in.*SearchInput:pytest.PytestUnraisableExceptionWarning",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
