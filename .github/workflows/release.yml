name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Linter
        run: uv run ruff check .

      - name: Run Formatter Check
        run: uv run ruff format --check .

      - name: Run Type Check
        run: uv run ty check

      - name: Check import contracts (layer boundaries)
        run: uv run lint-imports

      - name: Check for new large files (guardrail)
        run: uv run python scripts/check_large_files.py

      - name: Run Tests with coverage threshold
        run: uv run pytest --cov=src/codelab --cov-report=term-missing --cov-fail-under=85

  release:
    needs: verify
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Configure Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Commitizen Bump
        run: uv run cz bump --yes

      - name: Push changes and tags
        run: git push origin HEAD:${{ github.ref_name }} --tags
